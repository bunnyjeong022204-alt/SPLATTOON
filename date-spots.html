<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>데이트 장소 지도</title>
  <style>
    :root {
      --paper: #f7f6ee;
      --ink: #161616;
      --muted: #6b6b6b;
      --pink: #f8a9c4;
      --pink-deep: #f0789f;
      --alert: #d6245a;
    }
    html, body { margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, "Malgun Gothic", sans-serif; color: var(--ink); background: var(--paper); }

    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 20px; border-bottom: 2px solid var(--ink); }
    header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em; }
    header p { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px 8px; align-items: center; }
    select, button { font: inherit; font-weight: 700; padding: 10px 16px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
    select:hover, button:not(:disabled):hover { background: var(--pink); }
    button.primary { background: var(--ink); color: var(--paper); }
    button.primary:not(:disabled):hover { background: var(--pink-deep); color: var(--ink); }
    button:disabled { opacity: 0.35; cursor: default; }
    .status { font-size: 13px; font-weight: 700; color: var(--muted); }
    .status.error { color: var(--alert); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 14px; }
    .chip { padding: 7px 14px; font-size: 14px; }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

    main { padding: 0 16px 40px; }

    /* 맥 윈도우 느낌의 지도 프레임 */
    .window { display: flex; flex-direction: column; height: 60vh; min-height: 360px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 var(--ink); }
    .window-bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--pink); border-bottom: 2px solid var(--ink); font-size: 13px; font-weight: 800; }
    .dots { display: flex; gap: 6px; }
    .dots span { width: 11px; height: 11px; border: 2px solid var(--ink); border-radius: 50%; background: #fff; }
    #map { flex: 1; background: #ecebe3; }

    .count { font-size: 13px; font-weight: 700; color: var(--muted); margin: 20px 4px 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

    .card { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
    .card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .card:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .card.picked { background: var(--pink); }
    .card .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 800; }
    .tag { padding: 3px 9px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; }
    .card.picked .tag { background: var(--paper); }
    .card h2 { margin: 2px 0 0; font-size: 18px; font-weight: 900; }
    .card p { margin: 0; font-size: 14px; line-height: 1.5; color: #333; }
    .card a { margin-top: auto; align-self: flex-start; font-size: 13px; font-weight: 800; color: var(--ink); text-underline-offset: 3px; }

    .empty { font-size: 15px; font-weight: 700; color: var(--muted); }
    footer { padding: 16px 20px; border-top: 2px solid var(--ink); font-size: 12px; color: var(--muted); font-weight: 600; }

    @media (max-width: 600px) {
      header h1 { font-size: 24px; }
      .window { height: 52vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>데이트 장소 지도</h1>
    <p>지역, 분위기, 예산으로 골라 지도에서 확인하세요.</p>
  </header>

  <div class="filters">
    <select id="region" aria-label="지역">
      <option value="all">전국</option>
    </select>
    <select id="budget" aria-label="예산">
      <option value="all">예산 전체</option>
      <option value="1">저렴 ($)</option>
      <option value="2">보통 ($$)</option>
      <option value="3">여유 ($$$)</option>
    </select>
    <button class="primary" id="random" type="button" disabled>랜덤 추천</button>
    <span class="status" id="status">지도 불러오는 중...</span>
  </div>

  <div class="chips" id="categories" role="group" aria-label="분위기"></div>

  <main>
    <div class="window">
      <div class="window-bar"><span class="dots"><span></span><span></span><span></span></span>MAP · 데이트 코스</div>
      <div id="map"></div>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    장소 정보는 대략적인 소개입니다. 운영시간과 휴무일은 방문 전에 꼭 확인해 주세요.
  </footer>

  <script>
    'use strict';

    // ===== 설정 =====
    const CONFIG = {
      apiKey: 'YOUR_API_KEY',                  // 본인의 Google Maps API 키를 넣으세요
      center: { lat: 36.5, lng: 127.8 },       // 대한민국 중심
      zoom: 7,
    };

    const BUDGET_LABEL = { 1: '$ 저렴', 2: '$$ 보통', 3: '$$$ 여유' };
    const CATEGORIES = ['전체', '야경', '카페', '산책', '문화', '맛집', '액티비티'];

    // 장소 이름과 지역으로 구글에서 위치를 찾습니다 (좌표를 직접 적지 않습니다).
    const SPOTS = [
      { name: '남산서울타워', region: '서울', category: '야경', budget: 2, desc: '서울 도심이 한눈에 보이는 전망대. 해 질 녘에 올라가면 야경까지 볼 수 있어요.' },
      { name: '반포 한강공원 달빛광장', region: '서울', category: '야경', budget: 1, desc: '저녁에 분수 쇼가 펼쳐지는 한강변. 돗자리 하나면 충분해요.' },
      { name: '성수동 카페거리', region: '서울', category: '카페', budget: 2, desc: '공장을 개조한 카페와 편집숍이 모여 있어 걷기만 해도 즐거운 동네예요.' },
      { name: '북촌 한옥마을', region: '서울', category: '산책', budget: 1, desc: '골목을 따라 걸으며 한옥 지붕 사이의 풍경을 감상하는 산책 코스예요.' },
      { name: '서울숲', region: '서울', category: '산책', budget: 1, desc: '넓은 숲길과 잔디밭이 있어 여유롭게 걷고 피크닉하기 좋아요.' },
      { name: '잠실 롯데월드', region: '서울', category: '액티비티', budget: 3, desc: '놀이기구와 실내 어트랙션을 함께 즐길 수 있는 테마파크예요.' },
      { name: '수원 화성', region: '경기', category: '산책', budget: 1, desc: '성곽을 따라 걸으며 역사와 풍경을 함께 즐기는 산책 코스예요.' },
      { name: '남이섬', region: '강원', category: '산책', budget: 2, desc: '배를 타고 들어가는 섬. 메타세쿼이아 길과 자전거 산책이 인기예요.' },
      { name: '송도 센트럴파크', region: '인천', category: '야경', budget: 1, desc: '호수 주변을 따라 걷기 좋은 공원. 저녁 조명이 예쁜 곳이에요.' },
      { name: '인천 차이나타운', region: '인천', category: '맛집', budget: 2, desc: '짜장면과 중화요리를 나눠 먹으며 골목 구경하기 좋은 곳이에요.' },
      { name: '광안리 해수욕장', region: '부산', category: '야경', budget: 1, desc: '광안대교 야경이 바다에 비치는 곳. 해변 산책과 야경을 함께 즐길 수 있어요.' },
      { name: '감천문화마을', region: '부산', category: '문화', budget: 1, desc: '계단식 주택과 벽화가 이어진 마을. 사진 찍으며 걷기 좋아요.' },
      { name: '김광석길', region: '대구', category: '문화', budget: 1, desc: '가수 김광석의 노래와 벽화가 있는 골목길. 조용히 걷기 좋아요.' },
      { name: '수성못', region: '대구', category: '산책', budget: 1, desc: '호수 둘레를 따라 걷고 카페에서 쉬기 좋은 곳이에요.' },
      { name: '성심당 본점', region: '대전', category: '맛집', budget: 1, desc: '빵과 디저트로 유명한 곳. 간단히 들러 나눠 먹기 좋아요.' },
      { name: '양림동 역사문화마을', region: '광주', category: '문화', budget: 1, desc: '오래된 선교사 주택과 골목 산책을 함께 즐길 수 있는 마을이에요.' },
      { name: '강릉 안목해변 커피거리', region: '강원', category: '카페', budget: 2, desc: '바다 바로 앞에 카페가 늘어선 거리. 커피 한 잔과 바다 풍경이 좋아요.' },
      { name: '전주 한옥마을', region: '전북', category: '산책', budget: 2, desc: '한옥 골목을 걸으며 전통 간식과 풍경을 즐기는 여행지예요.' },
      { name: '여수 해상케이블카', region: '전남', category: '야경', budget: 2, desc: '바다 위를 건너며 여수 밤바다 야경을 볼 수 있어요.' },
      { name: '경주 대릉원', region: '경북', category: '산책', budget: 1, desc: '큰 고분들이 있는 공원. 천천히 거닐며 역사 분위기를 느낄 수 있어요.' },
      { name: '통영 동피랑 벽화마을', region: '경남', category: '문화', budget: 1, desc: '언덕 위 골목 전체가 벽화로 덮인 마을. 바다 전망도 좋아요.' },
      { name: '애월 카페거리', region: '제주', category: '카페', budget: 2, desc: '바다가 보이는 카페가 많은 해안 거리. 드라이브 중 들르기 좋아요.' },
    ];
    SPOTS.forEach((s, i) => { s.id = i; });

    const MAP_STYLE = [
      { elementType: 'geometry', stylers: [{ color: '#f7f6ee' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#161616' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#f7f6ee' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
      { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#d9d6c8' }] },
      { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#f8d3e0' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#f2d4df' }] },
      { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#ebe7d6' }] },
      { featureType: 'poi', elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
      { featureType: 'transit', stylers: [{ visibility: 'off' }] },
    ];

    const PIN = { idle: '#ffffff', active: '#f8a9c4' };

    function pinIcon(fill) {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">' +
        `<path d="M18 2C9.2 2 2 9.2 2 18c0 11.8 16 24 16 24s16-12.2 16-24C34 9.2 26.8 2 18 2z" fill="${fill}" stroke="#161616" stroke-width="2.5"/>` +
        '</svg>';
      return {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(36, 44),
        anchor: new google.maps.Point(18, 42),
        labelOrigin: new google.maps.Point(18, 17),
      };
    }

    const state = {
      map: null,
      service: null,
      infoWindow: null,
      region: 'all',
      budget: 'all',
      category: '전체',
      pickedId: null,
    };

    const els = {
      region: document.getElementById('region'),
      budget: document.getElementById('budget'),
      random: document.getElementById('random'),
      status: document.getElementById('status'),
      categories: document.getElementById('categories'),
      count: document.getElementById('count'),
      grid: document.getElementById('grid'),
    };

    function setupControls() {
      [...new Set(SPOTS.map((s) => s.region))].forEach((r) => {
        const option = document.createElement('option');
        option.value = r;
        option.textContent = r;
        els.region.appendChild(option);
      });

      CATEGORIES.forEach((c) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = c;
        chip.dataset.category = c;
        els.categories.appendChild(chip);
      });

      els.region.addEventListener('change', () => {
        state.region = els.region.value;
        applyFilter();
      });
      els.budget.addEventListener('change', () => {
        state.budget = els.budget.value;
        applyFilter();
      });
      els.categories.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        state.category = chip.dataset.category;
        applyFilter();
      });
      els.random.addEventListener('click', pickRandom);
      els.grid.addEventListener('click', (e) => {
        const card = e.target.closest('.card');
        if (card) selectSpot(SPOTS[Number(card.dataset.id)]);
      });
      els.grid.addEventListener('keydown', (e) => {
        const card = e.target.closest('.card');
        if (card && e.key === 'Enter') selectSpot(SPOTS[Number(card.dataset.id)]);
      });
    }

    function matches(spot) {
      return (state.region === 'all' || spot.region === state.region) &&
        (state.budget === 'all' || spot.budget === Number(state.budget)) &&
        (state.category === '전체' || spot.category === state.category);
    }

    function filtered() {
      return SPOTS.filter(matches);
    }

    // 필터가 바뀌면 핀, 카드, 지도 범위를 함께 갱신합니다.
    function applyFilter() {
      state.pickedId = null;
      document.querySelectorAll('.chip').forEach((chip) => {
        chip.setAttribute('aria-pressed', String(chip.dataset.category === state.category));
      });
      SPOTS.forEach((s) => {
        if (s.marker) s.marker.setVisible(matches(s));
      });
      render();
      fitVisible();
    }

    function fitVisible() {
      if (!state.map) return;
      const visible = SPOTS.filter((s) => s.marker && s.marker.getVisible());
      if (!visible.length) return;
      if (visible.length === 1) {
        state.map.setCenter(visible[0].marker.getPosition());
        state.map.setZoom(13);
        return;
      }
      const bounds = new google.maps.LatLngBounds();
      visible.forEach((s) => bounds.extend(s.marker.getPosition()));
      state.map.fitBounds(bounds);
    }

    function pickRandom() {
      const list = filtered().filter((s) => s.marker);
      if (!list.length) return;
      selectSpot(list[Math.floor(Math.random() * list.length)]);
    }

    function selectSpot(spot) {
      if (!spot || !spot.marker) return;
      state.pickedId = spot.id;
      refreshPins();
      render();
      state.map.panTo(spot.marker.getPosition());
      if (state.map.getZoom() < 13) state.map.setZoom(13);
      state.infoWindow.setContent(
        `<div style="font-family:'Helvetica Neue',Arial,'Malgun Gothic',sans-serif;max-width:220px">
          <strong style="font-size:15px">${escapeHtml(spot.name)}</strong>
          <div style="font-size:12px;margin:4px 0;color:#6b6b6b">${escapeHtml(spot.region)} · ${escapeHtml(spot.category)}</div>
          <div style="font-size:13px;line-height:1.5">${escapeHtml(spot.desc)}</div>
        </div>`
      );
      state.infoWindow.open({ map: state.map, anchor: spot.marker });
    }

    function refreshPins() {
      SPOTS.forEach((s) => {
        if (s.marker) s.marker.setIcon(pinIcon(s.id === state.pickedId ? PIN.active : PIN.idle));
      });
    }

    function mapsUrl(spot) {
      return 'https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(`${spot.name} ${spot.region}`);
    }

    function render() {
      const list = filtered();
      const pinned = list.filter((s) => s.marker).length;
      els.count.textContent = `${list.length}곳 · 지도에 표시 ${pinned}곳`;
      els.random.disabled = pinned === 0;

      if (!list.length) {
        els.grid.innerHTML = '<p class="empty">조건에 맞는 장소가 없어요. 필터를 바꿔 보세요.</p>';
        return;
      }

      els.grid.innerHTML = list.map((s) => `
        <article class="card${s.id === state.pickedId ? ' picked' : ''}" data-id="${s.id}" tabindex="0" role="button">
          <div class="meta">
            <span class="tag">${escapeHtml(s.region)}</span>
            <span class="tag">${escapeHtml(s.category)}</span>
            <span class="tag">${BUDGET_LABEL[s.budget]}</span>
          </div>
          <h2>${escapeHtml(s.name)}</h2>
          <p>${escapeHtml(s.desc)}</p>
          <a href="${mapsUrl(s)}" target="_blank" rel="noopener">구글 지도에서 보기 →</a>
        </article>`).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // Google Maps 콜백
    function initMap() {
      state.map = new google.maps.Map(document.getElementById('map'), {
        center: CONFIG.center,
        zoom: CONFIG.zoom,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        styles: MAP_STYLE,
      });
      state.service = new google.maps.places.PlacesService(state.map);
      state.infoWindow = new google.maps.InfoWindow();
      loadSpots();
    }
    window.initMap = initMap;

    function findSpot(spot) {
      return new Promise((resolve) => {
        state.service.findPlaceFromQuery(
          { query: `${spot.name} ${spot.region}`, fields: ['name', 'geometry'] },
          (results, status) => resolve(status === 'OK' && results[0] ? results[0].geometry.location : null)
        );
      });
    }

    async function loadSpots() {
      let failed = 0;
      for (const spot of SPOTS) {
        const location = await findSpot(spot);
        if (!location) {
          failed += 1;
          continue;
        }
        spot.marker = new google.maps.Marker({
          position: location,
          map: state.map,
          title: spot.name,
          icon: pinIcon(PIN.idle),
          label: { text: '♥', color: '#161616', fontWeight: 'bold' },
          visible: matches(spot),
        });
        spot.marker.addListener('click', () => selectSpot(spot));
      }
      els.status.textContent = failed ? `${failed}곳은 위치를 찾지 못했습니다.` : '지도 준비 완료';
      els.status.classList.toggle('error', failed > 0);
      render();
      fitVisible();
    }

    function showLoadError(message) {
      els.status.textContent = message;
      els.status.classList.add('error');
    }

    function loadGoogleMaps() {
      if (!CONFIG.apiKey || CONFIG.apiKey === 'YOUR_API_KEY') {
        showLoadError('CONFIG.apiKey에 Google Maps API 키를 입력하세요.');
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?' + new URLSearchParams({
        key: CONFIG.apiKey,
        libraries: 'places',
        language: 'ko',
        callback: 'initMap',
      });
      script.async = true;
      script.onerror = () => showLoadError('Google 지도를 불러오지 못했습니다. API 키와 네트워크를 확인하세요.');
      document.head.appendChild(script);
    }

    setupControls();
    render();
    loadGoogleMaps();
  </script>
</body>
</html>
